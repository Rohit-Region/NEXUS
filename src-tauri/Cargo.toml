[package]
name = "nexus"
version = "0.1.0"
description = "NEXUS Desktop Application"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# The Mac's own frameworks: speech, the calendar and Touch ID. They exist only
# on Apple platforms, so the Android build leaves them, and the code that uses
# them, out.
[target.'cfg(target_os = "macos")'.dependencies]
# NEXUS-010: on-device speech, explicitly approved.
# objc2-avf-audio is already present transitively via objc2-speech; declaring
# it directly is what lets us name AVAudioEngine / AVAudioPCMBuffer.
# objc2-av-foundation is deliberately NOT added (permission status is inferred
# from the AVAudioEngine start/error path instead).
objc2 = "0.6"
objc2-avf-audio = { version = "0.3.2", features = [
    "AVAudioEngine", "AVAudioNode", "AVAudioIONode", "AVAudioBuffer",
    "AVAudioFormat", "AVAudioTime", "AVAudioTypes",
    # NEXUS-011: AVSpeechSynthesizer. A feature of a crate already declared
    # above, so the dependency graph is unchanged and no new permission is
    # required: speaking is output, not capture.
    "AVSpeechSynthesis",
] }
objc2-foundation = "0.3.2"
# NEXUS: the local calendar, explicitly approved.
#
# EventKit rather than scripting Calendar.app, for one reason: AppleScript
# hands back a recurring meeting's series master with its RRULE, not the
# occurrence you asked about. On a work calendar most events recur, so a
# "today" built that way is mostly wrong dates. `eventsMatchingPredicate`
# returns expanded occurrences and handles EXDATE, edited single
# occurrences, time zones and DST, none of which is worth reimplementing.
objc2-event-kit = { version = "0.3.2", features = [
    "EKEventStore", "EKEvent", "EKCalendarItem", "EKCalendar",
    "EKTypes", "EKParticipant", "EKStructuredLocation", "EKObject",
    "block2",
] }
objc2-speech = "0.3.2"
# The Spending lock: Touch ID, with the Mac login password as macOS's own
# fallback. Only `evaluatePolicy` is used; nothing is enrolled or stored.
objc2-local-authentication = { version = "0.3.2", features = ["LAContext", "LAError", "LABiometryType", "block2"] }
block2 = "0.6"

# NEXUS mobile: HTTPS on Android, explicitly approved. The Mac sends through
# the system `curl` (see `assistant/http.rs`), and Android has none, so only
# the Android build carries a TLS stack: `ureq` over `rustls` with the Mozilla
# root certificates built in. 11 crates the Android build did not already
# have, and none in the Mac app.
[target.'cfg(target_os = "android")'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }
# The phone's fingerprint or face unlock for Spending, as Touch ID is on the Mac.
# 2.3 is the newest that works with this Tauri (2.11); 2.4 and later need 2.12.
tauri-plugin-biometric = "~2.3.2"
# Calls the phone's secret store (`assistant/android_secrets.rs`). Already in
# the Android build through Tauri, so it adds no crate.
jni = "0.21"

# The same client in the Mac's tests, so both transports are checked against
# each other there. A dev-dependency, so it never reaches the Mac app.
[dev-dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }
