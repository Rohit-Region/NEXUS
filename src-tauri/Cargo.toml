[package]
name = "nexus"
version = "0.1.0"
description = "NEXUS Desktop Application"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4"
# NEXUS-010: on-device speech, explicitly approved.
# objc2-avf-audio is already present transitively via objc2-speech; declaring
# it directly is what lets us name AVAudioEngine / AVAudioPCMBuffer.
# objc2-av-foundation is deliberately NOT added (permission status is inferred
# from the AVAudioEngine start/error path instead).
objc2 = "0.6"
objc2-avf-audio = { version = "0.3.2", features = [
    "AVAudioEngine", "AVAudioNode", "AVAudioIONode", "AVAudioBuffer",
    "AVAudioFormat", "AVAudioTime", "AVAudioTypes",
    # NEXUS-011: AVSpeechSynthesizer. A feature of a crate already declared
    # above, so the dependency graph is unchanged and no new permission is
    # required: speaking is output, not capture.
    "AVSpeechSynthesis",
] }
objc2-foundation = "0.3.2"
objc2-speech = "0.3.2"
block2 = "0.6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
